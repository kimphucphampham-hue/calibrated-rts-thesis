version: 1

dataset:
  name: "TCP-CI"
  version: "v3"

inputs:
  canonical_root: "data/processed/tcp_ci/pilot"
  pilot_projects_config: "configs/pilot_projects_v1.yaml"
  data_sources_config: "configs/data_sources_v1.yaml"

outputs:
  feature_root: "data/processed/tcp_ci/pilot_history"
  diagnostics_root: "results/pilot/history_features"

temporal_rule:
  target_build: "b"
  allowed_history: "build_index < b"
  same_build_outcome_allowed: false
  future_build_outcome_allowed: false

support_columns:
  - history_available
  - prior_execution_count
  - prior_failure_count

feature_columns:
  - failure_rate_history
  - recent_failure
  - consecutive_failures
  - consecutive_passes
  - test_age_builds
  - time_since_last_failure_builds
  - execution_time_mean_history_ms
  - changed_entity_count
  - recent_failure_density_10
  - execution_time_trend_10

definitions:

  failure_rate_history:
    history: "all prior executions of the same test"
    formula: "prior_failure_count / prior_execution_count"
    cold_start: null

  recent_failure:
    history: "most recent prior execution of the same test"
    cold_start: null

  consecutive_failures:
    history: "consecutive failed executions immediately before b"
    cold_start: 0

  consecutive_passes:
    history: "consecutive passed executions immediately before b"
    cold_start: 0

  test_age_builds:
    formula: >
      current build_index minus first observed build_index
      of the same test
    cold_start: 0

  time_since_last_failure_builds:
    formula: >
      current build_index minus the build_index of the most
      recent failure of the same test strictly before b
    no_prior_failure: null

  execution_time_mean_history_ms:
    history: "all prior executions of the same test"
    formula: "mean of prior execution_time_ms values"
    cold_start: null

notes:
  - >
    Current-build failed and execution_time_ms are retained only
    as observed outcome/cost fields and are never used to derive
    history features for that same row.

  - >
    Missing cold-start feature values are preserved in this
    stage. Imputation belongs to the later modeling protocol.