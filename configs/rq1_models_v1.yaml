version: "1.0"

freeze_id: "RQ1-MODELS-v1"

purpose: >
  Frozen prediction-model configuration for the RQ1 CORE
  experiment. Model parameters are fixed before inspecting
  model-performance results.

environment:
  scikit_learn_version: "1.6.1"
  xgboost_version: "2.1.4"

feature_config:
  source: "configs/core_features_v1.yaml"
  primary_feature_set: "F1_F2_F3"

target:
  field: "failed"

preprocessing:
  imputer:
    strategy: "median"
    add_indicator: true

  scaler:
    enabled: true

models:
  logistic_regression:
    status: "frozen"
    solver: "lbfgs"
    C: 1.0
    max_iter: 2000
    class_weight: null

  random_forest:
    status: "frozen"
    n_estimators: 100
    criterion: "gini"
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    max_features: "sqrt"
    bootstrap: true
    class_weight: null
    random_state: 42
    n_jobs: -1
    probability_output: "predict_proba"

  xgboost:
    status: "frozen"
    objective: "binary:logistic"
    booster: "gbtree"
    n_estimators: 100
    learning_rate: 0.3
    max_depth: 6
    min_child_weight: 1.0
    gamma: 0.0
    subsample: 1.0
    colsample_bytree: 1.0
    reg_alpha: 0.0
    reg_lambda: 1.0
    scale_pos_weight: 1.0
    tree_method: "hist"
    random_state: 42
    n_jobs: -1
    eval_metric: "logloss"
    probability_output: "predict_proba"

policy:
  hyperparameter_tuning: false
  performance_based_parameter_selection: false
  resampling: false
  smote: false

  parameter_freeze_rule: >
    Exact model parameters must be frozen before the first
    RQ1 model-performance run.

  outer_evaluation_used_for_parameter_selection: false

calibration:
  enabled_in_this_phase: false

notes:
  - >
    Random Forest parameters are intentionally fixed without
    result-driven tuning.

  - >
    class_weight is null so that the raw probability model is
    not deliberately altered through class reweighting before
    the planned calibration experiment.

  - >
    Shared preprocessing preserves median imputation,
    missingness indicators, and standard scaling used by the
    frozen Logistic Regression baseline.

  - >
    Probability calibration is performed in a later phase and
    must not be introduced during the raw Random Forest phase.

  - >
    XGBoost parameters are intentionally fixed before the first
    XGBoost model-performance run and are not selected from
    TCP-CI performance results.

  - >
    scale_pos_weight is 1.0 so that the raw XGBoost probability
    model is not deliberately altered through class reweighting
    before the planned calibration experiment.

  - >
    tree_method is explicitly fixed to hist for reproducible
    and computationally tractable CPU training on the CORE data.
