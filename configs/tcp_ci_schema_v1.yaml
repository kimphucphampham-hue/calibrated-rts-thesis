schema_version: "1.0"

dataset: "tcp_ci"

description: >
  Canonical schema for normalizing TCP-CI data before
  pilot experiments and thesis experiments.

# ============================================================
# OBSERVATION GRANULARITY
# ============================================================

staging:
  granularity: "test_job_execution"

  key:
    - project_id
    - build_id
    - job_id
    - test_id

  note: >
    Raw TCP-CI execution records may be associated with CI jobs.
    For the five pilot projects, no duplicate (build_id, test_id)
    groups, multi-job groups, or conflicting verdict groups were
    observed. Therefore, no aggregation is required when
    materializing the pilot test_build canonical representation.
    This condition must be revalidated if the project scope is
    expanded.


canonical:
  granularity: "test_build"

  primary_key:
    - project_id
    - build_id
    - test_id

  temporal_order:
    - project_id
    - build_started_at
    - build_id


# ============================================================
# CORE COLUMNS
# ============================================================

columns:

  project_id:
    data_type: "string"
    role: "identifier"
    unit: "N/A"
    required: true
    status: "CONFIRMED"
    source_candidates:
      - "project repository slug"
      - "project directory name"

  build_id:
    data_type: "string"
    role: "identifier"
    unit: "N/A"
    required: true
    status: "CONFIRMED"
    source_candidates:
      - "exe.csv:build"
      - "builds.csv:id"

  build_started_at:
    data_type: "datetime"
    role: "timestamp"
    unit: "UTC"
    required: true
    status: "CONFIRMED"
    source_candidates:
      - "builds.csv:started_at"

  build_index:
    data_type: "integer"
    role: "context"
    unit: "build"
    required: true
    status: "CONFIRMED"
    source_candidates:
      - "DERIVED"
    derivation: >
      Chronological dense index assigned within each project
      after ordering builds by build_started_at and using
      build_id as a deterministic tie breaker.

  test_id:
    data_type: "string"
    role: "identifier"
    unit: "N/A"
    required: true
    status: "CONFIRMED"
    source_candidates:
      - "exe.csv:test"

  execution_time_ms:
    data_type: "integer"
    role: "cost"
    unit: "milliseconds"
    required: true
    status: "CONFIRMED"

    available_at: "post_test_execution"
    history_scope: "current test execution"
    leakage_risk: "LEAKAGE"

    source_candidates:
      - "exe.csv:duration"

    derivation: >
      Direct identity mapping from `exe.csv:duration`.
      The inspected TCP-CI upstream implementation multiplies
      the parsed execution duration by 1000.0 before constructing
      an `ExecutionRecord`, and that integer value is subsequently
      written to `exe.csv`. Therefore, the published v3 duration
      is treated as milliseconds and no further numerical
      conversion is applied during thesis canonicalization.

    note: >
      The actual duration of the current test is available only
      after that test has executed and therefore must not be used
      directly as a pre-execution selection feature for the same
      build. A duration estimate derived strictly from executions
      before the target build must be used as decision-time cost.

  failed:
    data_type: "integer"
    role: "target"
    unit: "N/A"
    required: true
    status: "CONFIRMED"

    available_at: "post_test_execution"
    history_scope: "current test outcome"
    leakage_risk: "LEAKAGE"

    source_candidates:
      - "exe.csv:verdict"

    allowed_values:
      - 0
      - 1

    derivation: >
      For the downloaded TCP-CI v3 artifact, verdict=0 maps to
      failed=0 and verdict in {1,2} maps to failed=1.
      TCP-CI documentation additionally defines result code 3
      as an unknown failure; if encountered, it is also mapped
      to failed=1.

    source_note: >
      The downloaded TCP-CI v3 artifact uses the column name
      `verdict`, whereas the TCP-CI repository documentation
      refers to this execution-outcome concept as `test_result`.

# ============================================================
# OPTIONAL SOURCE METADATA
# ============================================================

optional_columns:

  job_id:
    data_type: "string"
    role: "metadata"
    status: "CONFIRMED"
    source_candidates:
      - "exe.csv:job"

  commit_hashes:
    data_type: "string"
    role: "context"
    status: "CONFIRMED"

    available_at: "pre_test_execution"
    history_scope: "current build context"
    leakage_risk: "SAFE"

    source_candidates:
      - "builds.csv:commits"

  test_method_count:
    data_type: "integer"
    role: "metadata"
    status: "UNAVAILABLE"
    source_candidates:
      - "count"
    note: >
      This concept is documented in the raw TCP-CI input format
      but the corresponding field was not observed in the
      downloaded TCP-CI v3 main-dataset `exe.csv` artifact.

  failure_count:
    data_type: "integer"
    role: "metadata"
    status: "UNAVAILABLE"
    source_candidates:
      - "failures"
    note: >
      This concept is documented in the raw TCP-CI input format
      but the corresponding field was not observed in the
      downloaded TCP-CI v3 main-dataset `exe.csv` artifact.

  error_count:
    data_type: "integer"
    role: "metadata"
    status: "UNAVAILABLE"
    source_candidates:
      - "errors"
    note: >
      This concept is documented in the raw TCP-CI input format
      but the corresponding field was not observed in the
      downloaded TCP-CI v3 main-dataset `exe.csv` artifact.

  skipped_count:
    data_type: "integer"
    role: "metadata"
    status: "UNAVAILABLE"
    source_candidates:
      - "skipped"
    note: >
      This concept is documented in the raw TCP-CI input format
      but the corresponding field was not observed in the
      downloaded TCP-CI v3 main-dataset `exe.csv` artifact.


# ============================================================
# CANDIDATE FEATURE SCHEMA
# ============================================================

candidate_features:

  history:

    failure_rate_history:
      data_type: "float"
      unit: "ratio"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "same test, builds < b"
      leakage_risk: "SAFE"

      derivation: >
        Number of failed prior executions of the same test
        divided by the number of observed prior executions.
        The current-build outcome is excluded.

    recent_failure:
      data_type: "integer"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "most recent execution of the same test before b"
      leakage_risk: "SAFE"

      allowed_values:
        - 0
        - 1

      derivation: >
        Binary failed value from the most recent observed
        execution of the same test strictly before build b.

    consecutive_failures:
      data_type: "integer"
      unit: "execution"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "same test, builds < b"
      leakage_risk: "SAFE"

      derivation: >
        Number of consecutive failed executions immediately
        preceding the target build.

    consecutive_passes:
      data_type: "integer"
      unit: "execution"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "same test, builds < b"
      leakage_risk: "SAFE"

      derivation: >
        Number of consecutive passed executions immediately
        preceding the target build.

    test_age_builds:
      data_type: "integer"
      unit: "build"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "same test, builds <= b; no outcomes from b"
      leakage_risk: "SAFE"

      derivation: >
        Current build_index minus the first observed
        build_index of the same test.

    time_since_last_failure_builds:
      data_type: "integer"
      unit: "build"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "same test, failures from builds < b"
      leakage_risk: "SAFE"

      derivation: >
        Current build_index minus the build_index of the
        most recent prior failure of the same test.

    execution_time_mean_history_ms:
      data_type: "float"
      unit: "milliseconds"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "same test, execution durations from builds < b"
      leakage_risk: "SAFE"

      derivation: >
        Arithmetic mean of execution_time_ms over all prior
        observed executions of the same test. The current-build
        execution duration is excluded.


  change_context:

    changed_loc:
      data_type: "integer"
      unit: "lines"
      required: false
      status: "CANDIDATE"

    changed_files_count:
      data_type: "integer"
      unit: "files"
      required: false
      status: "CANDIDATE"

    code_churn:
      data_type: "integer"
      unit: "lines"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "current build change context"
      leakage_risk: "SAFE"

    complexity:
      data_type: "float"
      required: false
      status: "CANDIDATE"

    dependency_score:
      data_type: "float"
      required: false
      status: "CANDIDATE"

    coverage_to_change:
      data_type: "float"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: >
        historical or otherwise pre-existing coverage combined
        with the current build change set

      leakage_risk: "CONDITIONAL"

      note: >
        Coverage produced by executing tests in the current build
        must not be used for selecting tests in that same build.


  temporal:

    recent_failure_density:
      data_type: "float"
      required: false
      status: "CANDIDATE"

      available_at: "pre_test_execution"
      history_scope: "configured window of builds < b"
      leakage_risk: "SAFE"

    execution_time_trend:
      data_type: "float"
      required: false
      status: "CANDIDATE"
      available_at: "pre_test_execution"
      history_scope: "historical execution durations from builds < b"
      leakage_risk: "SAFE"