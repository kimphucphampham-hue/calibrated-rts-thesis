version: 1

dataset:
  name: "TCP-CI"
  version: "v3"

purpose: >
  Minimal evaluation metric set for the five-project
  TCP-CI probabilistic pilot.

inputs:
  baseline_results_root: "results/pilot/baseline"
  pilot_projects_config: "configs/pilot_projects_v1.yaml"

outputs:
  metrics_root: "results/pilot/metrics"

target:
  field: "failed"

models:
  dummy_prior:
    probability_field: "p_dummy_prior"

  logistic_regression:
    probability_field: "p_logistic_regression"

metrics:
  discrimination:
    - roc_auc
    - average_precision
    - ap_lift

  probability_quality:
    - brier_score
    - log_loss

  calibration:
    - ece
    - mean_predicted_probability
    - calibration_bias
    - absolute_calibration_bias

ece:
  n_bins: 10
  strategy: "equal_width"
  lower_bound: 0.0
  upper_bound: 1.0

guards:
  evaluation_split: "test"
  threshold_dependent_metrics_enabled: false
  selection_metrics_enabled: false
  calibration_fit_enabled: false

notes:
  - >
    Metrics are computed from outer-test predictions generated
    by baseline v1. No model fitting or probability calibration
    is performed by this evaluation stage.

  - >
    Expected Calibration Error uses 10 equal-width probability
    bins over [0, 1]. Empty bins do not contribute to ECE.

  - >
    Average Precision is interpreted together with failure
    prevalence because the pilot datasets are highly imbalanced.

  - >
    Threshold-dependent classification metrics and operational
    test-selection metrics are intentionally deferred until an
    explicit decision/selection rule is defined.