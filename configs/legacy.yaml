# ============================================================
# LEGACY EXPERIMENT CONFIGURATION
# ============================================================

random_seed: 42
n_splits: 5

# both:
#   Chạy cả logic cũ và logic chia đúng theo Sprint.
#
# original:
#   Chỉ tái hiện cách chia theo từng dòng của source cũ.
#
# corrected:
#   Chỉ chạy cách chia theo Sprint hoàn chỉnh.
mode: both

data:
  path: data/raw/synthetic/synthetic_data.csv

output:
  directory: results/legacy/reproduction

smote:
  enabled: true
  k_neighbors: 5

models:
  random_forest:
    n_estimators: 100

  svm:
    kernel: rbf

  gradient_boosting:
    n_estimators: 100

# Kết quả được ghi tại Bảng 4.1 của báo cáo chuyên đề.
# Giá trị được lưu theo thang 0-1, không phải phần trăm.
reference_metrics:
  Random Forest:
    precision: 0.8361
    recall: 0.7411
    f1: 0.7857

  SVM:
    precision: 0.7409
    recall: 0.7609
    f1: 0.7499

  Gradient Boosting:
    precision: 0.7981
    recall: 0.7475
    f1: 0.7718