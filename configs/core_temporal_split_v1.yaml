version: 1
dataset:
  name: TCP-CI
  version: v3
purpose: Phase 11 ten-project chronological holdout for core-scale implementation
  validation.
inputs:
  history_root: data/processed/tcp_ci/core_history
  pilot_projects_config: configs/core_projects_v1.yaml
outputs:
  split_root: data/processed/tcp_ci/core_split
  diagnostics_root: results/core/temporal_split
split:
  unit: build
  strategy: chronological_holdout
  train_fraction: 0.8
  rounding: floor
  min_train_builds: 100
  min_test_builds: 20
  train_label: train
  test_label: test
temporal_rule:
  ordering_field: build_index
  train_before_test: true
  same_build_must_remain_in_one_split: true
  random_split_allowed: false
  label_stratification_allowed: false
holdout_policy:
  test_used_for_model_fit: false
  test_used_for_calibration_fit: false
  test_used_for_feature_selection: false
  test_used_for_hyperparameter_tuning: false
notes:
- 'The split boundary is determined only from chronological build order and the configured
  train fraction. Failure labels and execution costs do not influence the boundary.

  '
- 'History features remain causally defined using information available before each
  target build. For a later test-period build, history may contain outcomes from earlier
  test-period builds because those outcomes are chronologically available by that
  point.

  '
- 'Model parameters must nevertheless be fitted only from the training period unless
  a later explicitly defined retraining protocol permits otherwise.

  '
- This chronological holdout is used for Phase 11 core-scale implementation validation.
  It is not the primary final longitudinal evaluation; the final thesis RQ1 evidence
  uses a separately frozen walk-forward design.
